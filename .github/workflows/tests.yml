name: brew test-bot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test-bot:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Stage the checked-out PR as the installed tap so test-bot never falls
      # back to the repository's remote default branch.
      - name: Prepare exact pull request source
        shell: bash
        run: |
          tap_dir="$(brew --repository)/Library/Taps/t-py-t/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          mkdir -p "$tap_dir"
          cp -R "$GITHUB_WORKSPACE/." "$tap_dir/"

      - name: Validate tap syntax
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew test-bot --only-tap-syntax --tap=t-py-t/tap
