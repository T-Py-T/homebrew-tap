name: brew test-bot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test-bot:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
    permissions:
      contents: read
    steps:
      # actions/checkout cannot write the runner file-command directory from
      # this non-root Homebrew container. Fetch the exact PR head directly so
      # validation still fails closed without depending on a Node action.
      - name: Checkout exact pull request source
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${PR_HEAD_SHA}"
          git checkout --detach "${PR_HEAD_SHA}"

      # Stage the checked-out PR as the installed tap so test-bot never falls
      # back to the repository's remote default branch.
      - name: Prepare exact pull request source
        shell: bash
        run: |
          tap_dir="$(brew --repository)/Library/Taps/t-py-t/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          mkdir -p "$tap_dir"
          cp -R "$GITHUB_WORKSPACE/." "$tap_dir/"

      - name: Validate tap syntax
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew test-bot --only-tap-syntax --tap=t-py-t/tap
