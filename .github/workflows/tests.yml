name: brew test-bot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Validate tap syntax
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew test-bot --only-tap-syntax --tap=t-py-t/tap

      - name: Validate Focus Owned template syntax
        run: ruby -c Templates/focus-owned.rb.tmpl
